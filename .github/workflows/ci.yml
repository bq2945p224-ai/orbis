name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: orbis
          POSTGRES_PASSWORD: orbis
          POSTGRES_DB: orbis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbis -d orbis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://orbis:orbis@localhost:5432/orbis
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-min-16
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orbis/config build
      - run: pnpm --filter @orbis/contracts build
      - run: pnpm --filter @orbis/db build
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @orbis/api test
      - run: pnpm --filter @orbis/worker test
      - run: pnpm --filter @orbis/web build
